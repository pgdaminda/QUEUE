<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Queue</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col justify-between items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-md text-center border-b border-slate-800 pb-4 mt-2">
        <h1 class="text-2xl font-bold text-blue-400" id="org-name">Loading...</h1>
        <p class="text-xs text-slate-400 mt-1">Code: <span id="org-code" class="font-mono text-white font-bold"></span></p>
    </header>

    <!-- Main Live Counter Display -->
    <main class="w-full max-w-md text-center my-auto">
        <p class="text-xs uppercase tracking-widest text-slate-400 mb-3 font-semibold">Now Serving</p>
        
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-12 shadow-2xl">
            <span id="queue-number" class="text-9xl font-black text-emerald-400 tracking-tight">0</span>
        </div>
        
        <p class="text-[10px] text-slate-500 mt-4">● Live Real-Time Updates</p>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center text-[10px] text-slate-600 border-t border-slate-800 pt-3 mb-2">
        Queue ERP &bull; Public Display
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ORG_CODE = urlParams.get('org') || 'ORG001';
        
        document.getElementById('org-code').innerText = ORG_CODE;

        async function fetchLiveNumber() {
            try {
                const res = await fetch(`/api/queue/${ORG_CODE}`);
                const result = await res.json();
                if (result.success && result.data) {
                    document.getElementById('queue-number').innerText = result.data.current_number || 0;
                    document.getElementById('org-name').innerText = result.data.org_name || ORG_CODE;
                }
            } catch (err) {
                console.error(err);
            }
        }

        setInterval(fetchLiveNumber, 2000);
        fetchLiveNumber();
    </script>
</body>
</html>
