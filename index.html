<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizations Management - Queue Management ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex">

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="fixed inset-0 bg-gray-900 bg-opacity-95 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-700 text-gray-100">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold">System Login</h1>
                <p class="text-gray-400 text-sm">Queue Management ERP System</p>
            </div>

            <div id="errorMessage" class="bg-red-500 text-white p-3 rounded mb-4 text-sm hidden"></div>

            <form onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">ORG CODE (LEAVE BLANK IF MASTER ADMIN)</label>
                    <input type="text" id="loginOrgCode" placeholder="e.g., ORG001 (Optional for Master Admin)" 
                           class="w-full bg-gray-700 border border-gray-600 rounded p-3 text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">USERNAME</label>
                    <input type="text" id="username" required placeholder="Enter username" 
                           class="w-full bg-gray-700 border border-gray-600 rounded p-3 text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="mb-6">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">PASSWORD</label>
                    <input type="password" id="password" required placeholder="Enter password" 
                           class="w-full bg-gray-700 border border-gray-600 rounded p-3 text-white focus:outline-none focus:border-blue-500">
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded transition duration-200">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="appLayout" class="flex w-full min-h-screen hidden">
        
        <!-- SIDEBAR -->
        <aside class="w-64 bg-[#111827] text-gray-300 flex flex-col justify-between border-r border-gray-800">
            <div>
                <div class="p-5 border-b border-gray-800 bg-[#0f172a]">
                    <h2 class="text-white font-bold text-lg tracking-wide">QUEUE ERP</h2>
                    <p class="text-xs text-gray-400">Management System</p>
                </div>
                <nav class="p-4 space-y-1">
                    <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-600 text-white font-medium">
                        🏢 Organizations
                    </a>
                </nav>
            </div>
            <div class="p-4 border-t border-gray-800">
                <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-lg font-medium transition">
                    🚪 Logout
                </button>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <div class="flex-1 flex flex-col bg-gray-100">
            <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-8 shadow-sm">
                <h1 class="text-xl font-bold text-gray-800">Organizations Management</h1>
                <div class="text-sm font-medium text-gray-600">
                    Logged in as: <span id="userNameDisplay" class="font-bold text-blue-600"></span> 
                    (<span id="userRoleDisplay" class="uppercase text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold"></span>)
                </div>
            </header>

            <main class="p-8 flex-1">
                <div class="max-w-7xl mx-auto">
                    <div class="flex justify-between items-center mb-6 gap-4 flex-wrap">
                        <div class="flex gap-3 w-full md:w-auto flex-1 max-w-md">
                            <input type="text" id="searchInput" placeholder="Search by Org Code, Name, or Representative..." 
                                   class="bg-white border border-gray-300 rounded-lg px-4 py-2 w-full text-gray-800 focus:outline-none focus:border-blue-500 shadow-sm"
                                   oninput="fetchOrganizations(1)">
                        </div>
                        <div class="flex gap-3">
                            <button onclick="window.print()" class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded-lg font-semibold shadow transition">
                                🖨️ Print Page
                            </button>
                            <button id="addOrgBtn" onclick="openModal('add')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold shadow hidden transition">
                                + Add Organization
                            </button>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider border-b border-gray-200">
                                    <th class="p-4">Org Code</th>
                                    <th class="p-4">Organization Name</th>
                                    <th class="p-4">Representative</th>
                                    <th class="p-4">Phone / WhatsApp</th>
                                    <th class="p-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="orgTableBody" class="divide-y divide-gray-200 text-sm"></tbody>
                        </table>
                    </div>

                    <div class="flex justify-between items-center mt-6">
                        <span id="pageInfo" class="text-sm text-gray-600 font-medium">Page 1 of 1</span>
                        <div class="flex gap-2">
                            <button onclick="changePage(-1)" class="bg-white border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-50 text-gray-700 font-medium shadow-sm transition">Previous</button>
                            <button onclick="changePage(1)" class="bg-white border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-50 text-gray-700 font-medium shadow-sm transition">Next</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL FORM -->
    <div id="orgModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-2xl shadow-2xl border border-gray-200 text-gray-800">
            <h2 id="modalTitle" class="text-xl font-bold mb-4 text-gray-900 border-b pb-2">Add Organization</h2>
            <form id="orgForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="orgId">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Org Code</label>
                        <input type="text" id="orgCodeInput" class="w-full bg-gray-100 border border-gray-300 rounded-lg p-2.5 text-gray-700 font-mono font-bold" placeholder="e.g. ORG001" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Org Name</label>
                        <input type="text" id="orgName" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="mb-4" id="passwordContainer">
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Counter Login Password</label>
                    <input type="password" id="orgPassword" placeholder="Enter password" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Representative Name</label>
                        <input type="text" id="repName" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Representative Phone</label>
                        <input type="text" id="repPhone" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Phone Number</label>
                        <input type="text" id="phone" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">WhatsApp Number</label>
                        <input type="text" id="whatsapp" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Email</label>
                        <input type="email" id="email" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Address</label>
                    <textarea id="address" rows="2" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg font-semibold transition">Cancel</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-semibold shadow transition">Save Organization</button>
                </div>
            </form>
        </div>
    </div>

    <!-- VIEW DETAILS MODAL -->
    <div id="viewModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-lg shadow-2xl border border-gray-200 text-gray-800">
            <h2 class="text-xl font-bold mb-4 text-gray-900 border-b pb-2">Organization Details</h2>
            <div id="viewDetailsContent" class="space-y-3 text-sm"></div>
            <div class="flex justify-end mt-6">
                <button type="button" onclick="closeViewModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-semibold transition">Close</button>
            </div>
        </div>
    </div>

    <!-- QR CODE MODAL -->
    <div id="qrModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl border border-gray-200 text-gray-800 text-center">
            <h2 class="text-lg font-bold mb-2 text-gray-900" id="qrOrgTitle">Public QR Code</h2>
            <p class="text-xs text-gray-500 mb-4" id="qrOrgCodeSub"></p>
            <div id="qrcode" class="flex justify-center mb-4 p-4 bg-gray-50 border rounded-xl"></div>
            <div class="flex gap-2 justify-center">
                <button type="button" onclick="downloadQR()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Download QR</button>
                <button type="button" onclick="closeQRModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold transition">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase Client Initialization (ඔබගේ Supabase අගයන් මෙහි යොදන්න)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentPage = 1;
        let totalPages = 1;
        let currentUserRole = '';
        let pageSize = 10;

        document.addEventListener("DOMContentLoaded", () => {
            const user = localStorage.getItem('currentUser');
            if (user) {
                const userData = JSON.parse(user);
                currentUserRole = userData.role;
                showAppLayout(userData);
            }
        });

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            try {
                // Supabase users table එකෙන් පරිශීලකයා පරීක්ෂා කිරීම
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    errorDiv.innerText = 'Invalid username or password!';
                    errorDiv.classList.remove('hidden');
                } else {
                    localStorage.setItem('currentUser', JSON.stringify(data));
                    localStorage.setItem('userRole', data.role);
                    currentUserRole = data.role;
                    showAppLayout(data);
                }
            } catch (err) {
                errorDiv.innerText = 'Connection error!';
                errorDiv.classList.remove('hidden');
            }
        }

        function showAppLayout(userData) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appLayout').classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = userData.username;
            document.getElementById('userRoleDisplay').innerText = userData.role;

            if (userData.role === 'master_admin' || userData.role === 'admin') {
                document.getElementById('addOrgBtn').classList.remove('hidden');
            }
            fetchOrganizations(1);
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('userRole');
            location.reload();
        }

        async function fetchOrganizations(page) {
            currentPage = page;
            const search = document.getElementById('searchInput').value.trim();
            
            let query = supabaseClient.from('organizations').select('*', { count: 'exact' });

            if (search) {
                query = query.or(`org_code.ilike.%${search}%,org_name.ilike.%${search}%,representative_name.ilike.%${search}%`);
            }

            const from = (page - 1) * pageSize;
            const to = from + pageSize - 1;
            query = query.range(from, to).order('created_at', { ascending: false });

            const { data, count, error } = await query;

            if (!error) {
                const tbody = document.getElementById('orgTableBody');
                tbody.innerHTML = '';
                totalPages = Math.ceil(count / pageSize) || 1;
                document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${totalPages}`;

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">No organizations found.</td></tr>`;
                    return;
                }

                data.forEach(org => {
                    let deleteBtn = '';
                    if (currentUserRole === 'master_admin') {
                        deleteBtn = `<button onclick="deleteOrg('${org.id}')" class="text-red-600 hover:text-red-800 font-medium ml-2">Delete</button>`;
                    }

                    let editBtn = '';
                    if (currentUserRole === 'master_admin' || currentUserRole === 'admin') {
                        editBtn = `<button onclick='openModal("edit", ${JSON.stringify(org)})' class="text-blue-600 hover:text-blue-800 font-medium mr-2">Edit</button>`;
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 transition border-b border-gray-100">
                            <td class="p-4 font-mono font-semibold text-gray-700">${org.org_code}</td>
                            <td class="p-4 font-medium text-gray-900">${org.org_name}</td>
                            <td class="p-4 text-gray-600">${org.representative_name || '-'}</td>
                            <td class="p-4 text-gray-600">${org.phone_number || '-'}</td>
                            <td class="p-4 text-right space-x-1">
                                <button onclick='viewOrg(${JSON.stringify(org)})' class="text-emerald-600 hover:text-emerald-800 font-medium">View</button>
                                <button onclick='printOrg(${JSON.stringify(org)})' class="text-gray-600 hover:text-gray-900 font-medium ml-2">Print</button>
                                <button onclick='openQRModal("${org.org_code}", "${org.org_name}")' class="text-indigo-600 hover:text-indigo-800 font-medium ml-2">QR</button>
                                ${editBtn}
                                ${deleteBtn}
                            </td>
                        </tr>
                    `;
                });
            }
        }

        function changePage(direction) {
            let newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                fetchOrganizations(newPage);
            }
        }

        async function openModal(mode, org = null) {
            document.getElementById('orgModal').classList.remove('hidden');
            if (mode === 'add') {
                document.getElementById('modalTitle').innerText = 'Add Organization';
                document.getElementById('orgForm').reset();
                document.getElementById('orgId').value = '';
                document.getElementById('orgPassword').required = true;
                document.getElementById('orgCodeInput').value = 'ORG00' + Math.floor(Math.random() * 900 + 100);
            } else {
                document.getElementById('modalTitle').innerText = 'Edit Organization';
                document.getElementById('orgId').value = org.id;
                document.getElementById('orgCodeInput').value = org.org_code;
                document.getElementById('orgName').value = org.org_name;
                document.getElementById('orgPassword').value = '';
                document.getElementById('orgPassword').required = false;
                document.getElementById('repName').value = org.representative_name || '';
                document.getElementById('repPhone').value = org.representative_phone || '';
                document.getElementById('phone').value = org.phone_number || '';
                document.getElementById('whatsapp').value = org.whatsapp_number || '';
                document.getElementById('email').value = org.email || '';
                document.getElementById('address').value = org.address || '';
            }
        }

        function closeModal() {
            document.getElementById('orgModal').classList.add('hidden');
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('orgId').value;
            const payload = {
                org_code: document.getElementById('orgCodeInput').value,
                org_name: document.getElementById('orgName').value,
                representative_name: document.getElementById('repName').value,
                representative_phone: document.getElementById('repPhone').value,
                phone_number: document.getElementById('phone').value,
                whatsapp_number: document.getElementById('whatsapp').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value
            };

            const password = document.getElementById('orgPassword').value;
            if (password) {
                payload.password = password;
            }

            let error;
            if (id) {
                const { error: err } = await supabaseClient.from('organizations').update(payload).eq('id', id);
                error = err;
            } else {
                const { error: err } = await supabaseClient.from('organizations').insert([payload]);
                error = err;
            }

            if (!error) {
                closeModal();
                fetchOrganizations(currentPage);
            } else {
                alert('Error saving organization: ' + error.message);
            }
        }

        function viewOrg(org) {
            document.getElementById('viewModal').classList.remove('hidden');
            document.getElementById('viewDetailsContent').innerHTML = `
                <p><strong>Org Code:</strong> <span class="font-mono">${org.org_code}</span></p>
                <p><strong>Organization Name:</strong> ${org.org_name}</p>
                <p><strong>Representative Name:</strong> ${org.representative_name || '-'}</p>
                <p><strong>Representative Phone:</strong> ${org.representative_phone || '-'}</p>
                <p><strong>Phone Number:</strong> ${org.phone_number || '-'}</p>
                <p><strong>WhatsApp Number:</strong> ${org.whatsapp_number || '-'}</p>
                <p><strong>Email:</strong> ${org.email || '-'}</p>
                <p><strong>Address:</strong> ${org.address || '-'}</p>
                <p><strong>Public Live Link:</strong> <a href="/q.html?org=${org.org_code}" target="_blank" class="text-blue-600 underline">/q.html?org=${org.org_code}</a></p>
            `;
        }

        function closeViewModal() {
            document.getElementById('viewModal').classList.add('hidden');
        }

        function printOrg(org) {
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head><title>Print Organization - ${org.org_name}</title></head>
                <body style="font-family: Arial; padding: 20px;">
                    <h2>Organization Details</h2>
                    <hr/>
                    <p><strong>Org Code:</strong> ${org.org_code}</p>
                    <p><strong>Organization Name:</strong> ${org.org_name}</p>
                    <p><strong>Representative Name:</strong> ${org.representative_name || '-'}</p>
                    <p><strong>Representative Phone:</strong> ${org.representative_phone || '-'}</p>
                    <p><strong>Phone Number:</strong> ${org.phone_number || '-'}</p>
                    <p><strong>WhatsApp Number:</strong> ${org.whatsapp_number || '-'}</p>
                    <p><strong>Email:</strong> ${org.email || '-'}</p>
                    <p><strong>Address:</strong> ${org.address || '-'}</p>
                    <script>window.print();window.close();<\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        let currentQR = null;
        function openQRModal(orgCode, orgName) {
            document.getElementById('qrModal').classList.remove('hidden');
            document.getElementById('qrOrgTitle').innerText = orgName;
            document.getElementById('qrOrgCodeSub').innerText = `Code: ${orgCode}`;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            
            const publicUrl = `${window.location.origin}/q.html?org=${orgCode}`;
            currentQR = new QRCode(qrContainer, {
                text: publicUrl,
                width: 180,
                height: 180
            });
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        function downloadQR() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            if (qrCanvas) {
                const imageURI = qrCanvas.toDataURL("image/png");
                const a = document.createElement('a');
                a.href = imageURI;
                a.download = 'queue-qr-code.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                alert('QR Code is still generating, please wait a second.');
            }
        }

        async function deleteOrg(id) {
            if (confirm('Are you sure you want to delete this organization?')) {
                const { error } = await supabaseClient.from('organizations').delete().eq('id', id);
                if (!error) {
                    fetchOrganizations(currentPage);
                } else {
                    alert('Error deleting organization: ' + error.message);
                }
            }
        }
    </script>
</body>
</html>
