<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Queue ERP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between shrink-0">
        <div>
            <div class="h-16 flex items-center px-6 bg-slate-950 font-bold text-lg tracking-wide border-b border-slate-800">
                <i class="fa-solid fa-layer-group text-blue-500 mr-3 text-xl"></i>
                <span>QUEUE ERP SYSTEM</span>
            </div>
            <nav class="mt-6 px-3 space-y-1">
                <a href="../dashboard.html" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-chart-line w-6"></i> Main Dashboard
                </a>
                <a href="organizations.html" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-building w-6"></i> Organizations
                </a>
                <a href="manage-users.html" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg bg-blue-600 text-white transition">
                    <i class="fa-solid fa-users-gear w-6"></i> Manage Users
                </a>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm">
            <h1 class="text-xl font-bold text-gray-800">User Level Management</h1>
            <a href="../index.html" class="text-sm font-semibold text-red-600 hover:text-red-800 transition flex items-center">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
            </a>
        </header>

        <main class="p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- User Creation Form -->
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm h-fit">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Create System User</h2>
                <form id="user-form" onsubmit="saveUser(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Username</label>
                        <input type="text" id="username" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                        <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">User Role</label>
                        <select id="role" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="Admin">Admin (System Access)</option>
                            <option value="Customer">Customer (Counter Control Only)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Assigned Organization</label>
                        <select id="org_code" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="">-- None (For Super Admin) --</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">
                        Save User
                    </button>
                </form>
            </div>

            <!-- Users List Table -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                <h2 class="text-lg font-bold text-gray-800 mb-4">System Users List</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b text-xs uppercase text-gray-500 font-semibold">
                                <th class="p-3">Username</th>
                                <th class="p-3">Role</th>
                                <th class="p-3">Assigned Org</th>
                                <th class="p-3">Created At</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body" class="text-sm text-gray-700 divide-y">
                            <!-- Data populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://ayzhzposnnqxvvxjdfqf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ANkZqPHUnvCCRe4fZzj5PA_o8i8p9eD';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadOrgOptions() {
            const { data } = await supabase.from('organizations').select('org_code, org_name');
            if (data) {
                const select = document.getElementById('org_code');
                data.forEach(org => {
                    select.innerHTML += `<option value="${org.org_code}">${org.org_name} (${org.org_code})</option>`;
                });
            }
        }

        async function fetchUsers() {
            const { data } = await supabase.from('system_users').select('*');
            if (data) {
                const tbody = document.getElementById('user-table-body');
                tbody.innerHTML = '';
                data.forEach(user => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 font-semibold text-gray-800">${user.username}</td>
                            <td class="p-3">
                                <span class="px-2 py-1 text-xs rounded-full font-semibold ${user.role === 'Admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                                    ${user.role}
                                </span>
                            </td>
                            <td class="p-3">${user.org_code || 'All (Admin)'}</td>
                            <td class="p-3 text-xs text-gray-500">${new Date(user.created_at).toLocaleDateString()}</td>
                        </tr>
                    `;
                });
            }
        }

        async function saveUser(event) {
            event.preventDefault();
            const userData = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value.trim(),
                role: document.getElementById('role': value),
                org_code: document.getElementById('org_code').value || null
            };

            const { error } = await supabase.from('system_users').insert([userData]);
            if (!error) {
                alert('User created successfully!');
                document.getElementById('user-form').reset();
                fetchUsers();
            } else {
                alert('Error creating user: ' + error.message);
            }
        }

        loadOrgOptions();
        fetchUsers();
    </script>
</body>
</html>
